name: Test

on: push

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: build & test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Pinned to 1.96.0 so the clippy gate stays deterministic (new toolchains
      # can introduce lints). oxc 0.134.0 needs Rust >=1.94; we are well past it.
      - name: Install Rust 1.96.0
        uses: dtolnay/rust-toolchain@1.96.0

      # Caches ~/.cargo (registry, git, bin) and ./target, keyed on Cargo.lock
      # plus the toolchain. Restores across runs so deps aren't recompiled.
      - name: Cache cargo & target
        uses: Swatinem/rust-cache@v2

      # node is needed by the corpus differential tests in tests/integration.rs
      # (they skip gracefully if absent, but we want them to actually run).
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build (release)
        run: cargo build --release --locked

      - name: Test
        run: cargo test --release --locked

  difftest:
    name: differential test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.96.0
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Cache cargo & target
        uses: Swatinem/rust-cache@v2

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build (release)
        run: cargo build --release --locked

      # Compiles every corpus program at -O0..-Os, runs each through node, and
      # fails if any optimization level diverges from the -O0 baseline.
      - name: Run differential corpus test
        run: bash difftest/run.sh

  fmt:
    name: rustfmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.96.0
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt

      - name: Format check
        run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.96.0
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy

      - name: Cache cargo & target
        uses: Swatinem/rust-cache@v2

      # Warnings fail the build so the tree stays clippy-clean.
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
