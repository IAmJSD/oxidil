name: Test

on: push

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: build & test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust 1.96.0
        uses: dtolnay/rust-toolchain@1.96.0
      - name: Cache cargo & target
        uses: Swatinem/rust-cache@v2
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Build (release)
        run: cargo build --release --locked
      - name: Test
        run: cargo test --release --locked

  difftest:
    name: differential test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust 1.96.0
        uses: dtolnay/rust-toolchain@1.96.0
      - name: Cache cargo & target
        uses: Swatinem/rust-cache@v2
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Build (release)
        run: cargo build --release --locked
      - name: Run differential corpus test
        run: bash difftest/run.sh

  fmt:
    name: rustfmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust 1.96.0
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt

      - name: Format check
        run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust 1.96.0
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy

      - name: Cache cargo & target
        uses: Swatinem/rust-cache@v2

      # Warnings fail the build so the tree stays clippy-clean.
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
