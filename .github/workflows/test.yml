name: Test

on: push

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: build & test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust 1.96.0
        uses: dtolnay/rust-toolchain@1.96.0
      - name: Cache cargo & target
        uses: Swatinem/rust-cache@v2
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Build (release)
        run: cargo build --release --locked
      - name: Test
        run: cargo test --release --locked

  difftest:
    name: differential test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust 1.96.0
        uses: dtolnay/rust-toolchain@1.96.0
      - name: Cache cargo & target
        uses: Swatinem/rust-cache@v2
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Build (release)
        run: cargo build --release --locked
      - name: Run differential corpus test
        run: bash difftest/run.sh

  npm-package:
    name: npm package (wasm) build & test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust 1.96.0
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: wasm32-unknown-unknown
      - name: Cache cargo & target
        uses: Swatinem/rust-cache@v2
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      # `make npm` generates the version files from Cargo.toml, then runs
      # wasm-pack + tsc — the same build path the publish workflow uses.
      - name: Build npm package
        run: make npm
      - name: Test npm package
        working-directory: npm
        run: npm test

  fmt:
    name: rustfmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust 1.96.0
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt

      - name: Format check
        run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust 1.96.0
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy

      - name: Cache cargo & target
        uses: Swatinem/rust-cache@v2

      # Warnings fail the build so the tree stays clippy-clean.
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
