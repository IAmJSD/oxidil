name: Compile on new release

on: push

jobs:
  check-if-new-release:
    name: Check if this is a new release
    outputs:
      version: ${{ steps.version-get.outputs.VERSION }}
    runs-on: ubuntu-24.04-arm
    steps:
      - run: pip install toml
      - uses: actions/checkout@v6
      - name: Get the version
        id: version-get
        run: |
          set -eo pipefail
          VERSION=$(python -c "import toml; print('v' + toml.load('Cargo.toml')['package']['version'])")
          if [ -n "$(git tag -l "$VERSION")" ]; then
            echo "VERSION=" >> $GITHUB_OUTPUT
          else
            echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          fi

  get-release-notes:
    name: Get release notes
    runs-on: ubuntu-24.04-arm
    needs: [check-if-new-release]
    if: needs.check-if-new-release.outputs.version != ''
    outputs:
      release-notes: ${{ steps.release-notes.outputs.RELEASE_NOTES }}
    steps:
      - name: Install git-cliff
        run: |
          set -eo pipefail
          wget https://github.com/orhun/git-cliff/releases/download/v2.12.0/git-cliff-2.12.0-aarch64-unknown-linux-gnu.tar.gz
          tar -xvzf git-cliff-2.12.0-aarch64-unknown-linux-gnu.tar.gz
          sudo mv ./git-cliff-2.12.0/git-cliff /usr/local/bin/git-cliff
          sudo chmod +x /usr/local/bin/git-cliff
          rm git-cliff-2.12.0-aarch64-unknown-linux-gnu.tar.gz
          rm -rf git-cliff-2.12.0

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get release notes
        id: release-notes
        run: |
          set -eo pipefail
          git-cliff --unreleased --output CHANGELOG.md
          echo "RELEASE_NOTES=$(base64 -w 0 CHANGELOG.md)" >> $GITHUB_OUTPUT

  linux-comp:
    name: Compile (${{ matrix.target }})
    runs-on: ubuntu-24.04-arm
    needs: [check-if-new-release]
    if: needs.check-if-new-release.outputs.version != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
            method: native
          - target: x86_64-unknown-linux-gnu
            method: linux-cross
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust 1.96.0
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo & target
        uses: Swatinem/rust-cache@v2

      - name: Install x86_64 Linux cross linker
        if: matrix.method == 'linux-cross'
        run: |
          set -eo pipefail
          sudo apt-get update
          sudo apt-get install -y gcc-x86-64-linux-gnu

      - name: Build (release)
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: x86_64-linux-gnu-gcc
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Upload binary
        uses: actions/upload-artifact@v6
        with:
          name: oxidil-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/oxidil
          if-no-files-found: error

  macos-comp:
    name: Compile (${{ matrix.target }})
    runs-on: macos-26
    needs: [check-if-new-release]
    if: needs.check-if-new-release.outputs.version != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
          - target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust 1.96.0
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo & target
        uses: Swatinem/rust-cache@v2

      - name: Build (release)
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Setup signing keychain
        env:
          MACOS_APP_CERTIFICATE_BASE64: ${{ secrets.MACOS_APP_CERTIFICATE_BASE64 }}
          MACOS_APP_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_APP_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -eo pipefail

          APP_CERT_PATH="$RUNNER_TEMP/developer_id_application.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo "$MACOS_APP_CERTIFICATE_BASE64" | base64 --decode > "$APP_CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$APP_CERT_PATH" \
            -P "$MACOS_APP_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -d user -s "$KEYCHAIN_PATH"

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          echo "Available code signing identities:"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Sign binary
        env:
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
        run: |
          set -eo pipefail

          BIN_PATH="target/${{ matrix.target }}/release/oxidil"

          codesign \
            --force \
            --options runtime \
            --timestamp \
            --sign "$MACOS_CODESIGN_IDENTITY" \
            "$BIN_PATH"

          codesign --verify --verbose=4 "$BIN_PATH"
          codesign --display --verbose=4 "$BIN_PATH"

      - name: Create notarization archive
        run: |
          set -eo pipefail

          BIN_PATH="$(pwd)/target/${{ matrix.target }}/release/oxidil"
          DIST_DIR="$RUNNER_TEMP/dist"
          ARCHIVE_PATH="$RUNNER_TEMP/oxidil-${{ matrix.target }}.zip"

          mkdir -p "$DIST_DIR"
          cp "$BIN_PATH" "$DIST_DIR/oxidil"
          chmod +x "$DIST_DIR/oxidil"

          pushd "$DIST_DIR"
          ditto -c -k --sequesterRsrc --keepParent oxidil "$ARCHIVE_PATH"
          popd

          echo "ARCHIVE_PATH=$ARCHIVE_PATH" >> "$GITHUB_ENV"

      - name: Notarize archive
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -eo pipefail

          xcrun notarytool submit "$ARCHIVE_PATH" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --wait

      - name: Verify notarized archive
        run: |
          set -eo pipefail

          # A standalone CLI binary cannot be stapled, and spctl cannot assess
          # a .zip (it has no signature of its own). notarytool --wait already
          # confirmed the submission was Accepted, so here we just confirm the
          # binary inside the archive carries an intact, hardened-runtime
          # signature.
          VERIFY_DIR="$RUNNER_TEMP/verify"
          rm -rf "$VERIFY_DIR"
          mkdir -p "$VERIFY_DIR"
          ditto -x -k "$ARCHIVE_PATH" "$VERIFY_DIR"

          BIN="$(find "$VERIFY_DIR" -type f -name oxidil | head -n1)"
          if [ -z "$BIN" ]; then
            echo "Could not find oxidil binary in extracted archive:" >&2
            find "$VERIFY_DIR" >&2
            exit 1
          fi

          codesign --verify --strict --verbose=4 "$BIN"
          codesign --display --verbose=4 "$BIN"

      - name: Upload notarized archive
        uses: actions/upload-artifact@v6
        with:
          name: oxidil-${{ matrix.target }}
          path: ${{ env.ARCHIVE_PATH }}
          if-no-files-found: error

  win-comp:
    name: Compile (${{ matrix.target }})
    runs-on: windows-2025-vs2026
    needs: [check-if-new-release]
    if: needs.check-if-new-release.outputs.version != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
          - target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust 1.96.0
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo & target
        uses: Swatinem/rust-cache@v2

      - name: Build (release)
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Upload binary
        uses: actions/upload-artifact@v6
        with:
          name: oxidil-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/oxidil.exe
          if-no-files-found: error

  publish-release:
    name: Publish Release
    permissions:
      contents: write
    needs:
      [
        check-if-new-release,
        get-release-notes,
        linux-comp,
        macos-comp,
        win-comp,
      ]
    runs-on: ubuntu-24.04-arm
    if: needs.check-if-new-release.outputs.version != ''
    steps:
      - name: Decode release notes
        run: |
          set -eo pipefail
          echo "${{ needs.get-release-notes.outputs.release-notes }}" | base64 --decode > CHANGELOG.md

      - uses: actions/download-artifact@v8

      - name: Move artifacts for release
        run: |
          set -eo pipefail

          mkdir artifacts

          mv oxidil-aarch64-unknown-linux-gnu/oxidil \
            artifacts/oxidil-aarch64-linux-gnu

          mv oxidil-x86_64-unknown-linux-gnu/oxidil \
            artifacts/oxidil-x86_64-linux-gnu

          mv oxidil-x86_64-apple-darwin/oxidil-x86_64-apple-darwin.zip \
            artifacts/oxidil-x86_64-apple-darwin.zip

          mv oxidil-aarch64-apple-darwin/oxidil-aarch64-apple-darwin.zip \
            artifacts/oxidil-aarch64-apple-darwin.zip

          mv oxidil-x86_64-pc-windows-msvc/oxidil.exe \
            artifacts/oxidil-x86_64-pc-windows-msvc.exe

          mv oxidil-aarch64-pc-windows-msvc/oxidil.exe \
            artifacts/oxidil-aarch64-pc-windows-msvc.exe

      - name: Create release
        uses: ncipollo/release-action@v1
        with:
          artifacts: artifacts/*
          bodyFile: CHANGELOG.md
          tag: ${{ needs.check-if-new-release.outputs.version }}
          name: Oxidil ${{ needs.check-if-new-release.outputs.version }}
