name: Compile on new release

on: push

jobs:
  check-if-new-release:
    name: Check if this is a new relase
    outputs:
      version: ${{ steps.version-get.outputs.VERSION }}
    runs-on: ubuntu-24.04-arm
    steps:
      - run: pip install toml
      - uses: actions/checkout@v6
      - name: Get the version
        id: version-get
        run: |
          set -eo pipefail
          VERSION=$(python -c "import toml; print('v' + toml.load('Cargo.toml')['package']['version'])")
          if [ -n "$(git tag -l "$VERSION")" ]; then
            echo "VERSION=" >> $GITHUB_OUTPUT
          else
            echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          fi

  get-release-notes:
    name: Get release notes
    runs-on: ubuntu-24.04-arm
    needs: [check-if-new-release]
    if: needs.check-if-new-release.outputs.version != ''
    outputs:
      release-notes: ${{ steps.release-notes.outputs.RELEASE_NOTES }}
    steps:
      - name: Install git-cliff
        run: |
          set -eo pipefail
          wget https://github.com/orhun/git-cliff/releases/download/v2.12.0/git-cliff-2.12.0-aarch64-unknown-linux-gnu.tar.gz
          tar -xvzf git-cliff-2.12.0-aarch64-unknown-linux-gnu.tar.gz
          sudo mv ./git-cliff-2.12.0/git-cliff /usr/local/bin/git-cliff
          sudo chmod +x /usr/local/bin/git-cliff
          rm git-cliff-2.12.0-aarch64-unknown-linux-gnu.tar.gz
          rm -rf git-cliff-2.12.0
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Get release notes
        id: release-notes
        run: |
          set -eo pipefail
          git-cliff --unreleased --output CHANGELOG.md
          echo "RELEASE_NOTES=$(base64 -w 0 CHANGELOG.md)" >> $GITHUB_OUTPUT

  linux-and-windows-comp:
    name: Compile (${{ matrix.target }})
    runs-on: ubuntu-24.04-arm
    needs: [check-if-new-release]
    if: needs.check-if-new-release.outputs.version != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native build on the arm64 runner.
          - target: aarch64-unknown-linux-gnu
            binary: oxidil
            method: native
          # Cross-compiled to x86_64 with the GNU cross linker.
          - target: x86_64-unknown-linux-gnu
            binary: oxidil
            method: linux-cross
          # Cross-compiled to x86_64 Windows with cargo-xwin (downloads the MSVC CRT/SDK).
          - target: x86_64-pc-windows-msvc
            binary: oxidil.exe
            method: xwin
          # Cross-compiled to ARM Windows with cargo-xwin (downloads the MSVC CRT/SDK).
          - target: aarch64-pc-windows-msvc
            binary: oxidil.exe
            method: xwin
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust 1.96.0
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: ${{ matrix.target }}
      - name: Cache cargo & target
        uses: Swatinem/rust-cache@v2

      - name: Install x86_64 Linux cross linker
        if: matrix.method == 'linux-cross'
        run: |
          set -eo pipefail
          sudo apt-get update
          sudo apt-get install -y gcc-x86-64-linux-gnu
      - name: Install cargo-xwin toolchain
        if: matrix.method == 'xwin'
        run: |
          set -eo pipefail
          sudo apt-get update
          sudo apt-get install -y clang llvm lld
          cargo install --locked cargo-xwin

      - name: Build (release)
        if: matrix.method != 'xwin'
        env:
          # Only consulted for the x86_64 Linux target; harmless otherwise.
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: x86_64-linux-gnu-gcc
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Build (release, cargo-xwin)
        if: matrix.method == 'xwin'
        run: cargo xwin build --release --locked --target ${{ matrix.target }}

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: oxidil-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.binary }}
          if-no-files-found: error
